services:
  - type: web
    name: obsidian-backend
    env: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: obsidian-db
          property: connectionString
      - key: CLIENT_URL
        value: https://opsidianx.vercel.app/ # استبدله برابط فرونت إند الإنتاج

databases:
  - name: obsidian-db
    plan: free
    region: frankfurt
    databaseName: obsidian
    user: obsidian_user